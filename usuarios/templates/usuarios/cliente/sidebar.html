{% load static %}
<div class="mobile-topbar">
  <button id="sidebarToggle" class="sidebar-toggle-btn" type="button" aria-label="Abrir menu">
    <i class="bi bi-list"></i>
  </button>
  <a href="{% url 'dashboard' %}" class="mobile-topbar-brand">
    <img src="{% static 'inicio/img/marca/logo.jpg' %}" alt="Vet Arica" height="28" class="rounded" />
    Vet Arica
  </a>
</div>

<div id="sidebarBackdrop" class="sidebar-backdrop"></div>

<aside id="sidebar" class="sidebar sidebar-doctora">
  <div class="sidebar-brand">
    <img src="{% static 'inicio/img/marca/logo.jpg' %}" alt="Vet Arica" height="36" class="rounded" />
    <div>
      <strong>VetArica</strong>
      <span>Portal Cliente</span>
    </div>
  </div>

  <a href="{% url 'agendar' %}" class="btn btn-teal sidebar-cta">
    Agendar Cita
  </a>

  <nav class="sidebar-nav">
    <a href="{% url 'dashboard' %}" class="sidebar-link {% if request.resolver_match.url_name == 'dashboard' %}active{% endif %}" id="nav-inicio">
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" class="icon icon-tabler icons-tabler-outline icon-tabler-home">
        <path stroke="none" d="M0 0h24v24H0z" fill="none" />
        <path d="M5 12l-2 0l9 -9l9 9l-2 0" />
        <path d="M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2 -2v-7" />
        <path d="M9 21v-6a2 2 0 0 1 2 -2h2a2 2 0 0 1 2 2v6" />
      </svg>
      Inicio
    </a>
    <a href="{% url 'agregar_mascota' %}" class="sidebar-link {% if request.resolver_match.url_name == 'agregar_mascota' %}active{% endif %}" id="nav-nueva-mascota">
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" class="icon icon-tabler icons-tabler-outline icon-tabler-circle-plus">
        <path stroke="none" d="M0 0h24v24H0z" fill="none" />
        <path d="M3 12a9 9 0 1 0 18 0a9 9 0 0 0 -18 0" />
        <path d="M9 12h6" />
        <path d="M12 9v6" />
      </svg>
      Nueva Mascota
    </a>
    <a href="{% url 'historial_citas' %}" class="sidebar-link {% if request.resolver_match.url_name == 'historial_citas' %}active{% endif %}" id="nav-citas">
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" class="icon icon-tabler icons-tabler-outline icon-tabler-calendar">
        <path stroke="none" d="M0 0h24v24H0z" fill="none" />
        <path d="M4 7a2 2 0 0 1 2 -2h12a2 2 0 0 1 2 2v12a2 2 0 0 1 -2 2h-12a2 2 0 0 1 -2 -2v-12" />
        <path d="M16 3v4" />
        <path d="M8 3v4" />
        <path d="M4 11h16" />
        <path d="M11 15h1" />
        <path d="M12 15v3" />
      </svg>
      Mis Citas
    </a>
  </nav>

  <div class="sidebar-footer">
    <a href="{% url 'configuracion' %}" class="sidebar-link {% if request.resolver_match.url_name == 'configuracion' %}active{% endif %}" id="nav-config">
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" class="icon icon-tabler icons-tabler-outline icon-tabler-settings">
        <path stroke="none" d="M0 0h24v24H0z" fill="none" />
        <path d="M10.325 4.317c.426 -1.756 2.924 -1.756 3.35 0a1.724 1.724 0 0 0 2.573 1.066c1.543 -.94 3.31 .826 2.37 2.37a1.724 1.724 0 0 0 1.065 2.572c1.756 .426 1.756 2.924 0 3.35a1.724 1.724 0 0 0 -1.066 2.573c.94 1.543 -.826 3.31 -2.37 2.37a1.724 1.724 0 0 0 -2.572 1.065c-.426 1.756 -2.924 1.756 -3.35 0a1.724 1.724 0 0 0 -2.573 -1.066c-1.543 .94 -3.31 -.826 -2.37 -2.37a1.724 1.724 0 0 0 -1.065 -2.572c-1.756 -.426 -1.756 -2.924 0 -3.35a1.724 1.724 0 0 0 1.066 -2.573c-.94 -1.543 .826 -3.31 2.37 -2.37c1 .608 2.296 .07 2.572 -1.065" />
        <path d="M9 12a3 3 0 1 0 6 0a3 3 0 0 0 -6 0" />
      </svg>
      Configuración
    </a>
    <a href="{% url 'logout' %}" class="sidebar-link">
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" class="icon icon-tabler icons-tabler-outline icon-tabler-logout">
        <path stroke="none" d="M0 0h24v24H0z" fill="none" />
        <path d="M14 8v-2a2 2 0 0 0 -2 -2h-7a2 2 0 0 0 -2 2v12a2 2 0 0 0 2 2h7a2 2 0 0 0 2 -2v-2" />
        <path d="M9 12h12l-3 -3" />
        <path d="M18 15l3 -3" />
      </svg>
      Cerrar sesión
    </a>
  </div>
</aside>

<script>
  const sidebarToggle = document.getElementById("sidebarToggle");
  const sidebarEl = document.getElementById("sidebar");
  const sidebarBackdrop = document.getElementById("sidebarBackdrop");
  if (sidebarToggle && sidebarEl && sidebarBackdrop) {
    sidebarToggle.addEventListener("click", function () {
      sidebarEl.classList.add("sidebar-open");
      sidebarBackdrop.classList.add("show");
    });
    sidebarBackdrop.addEventListener("click", function () {
      sidebarEl.classList.remove("sidebar-open");
      sidebarBackdrop.classList.remove("show");
    });
  }
</script>
