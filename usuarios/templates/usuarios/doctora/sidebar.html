{% load static %}
<div class="mobile-topbar">
  <button id="sidebarToggle" class="sidebar-toggle-btn" type="button" aria-label="Abrir menu">
    <i class="bi bi-list"></i>
  </button>
  <a href="{% url 'inicio_doctora' %}" class="mobile-topbar-brand">
    <img src="{% static 'inicio/img/logo.jpg' %}" alt="Vet Arica" height="28" class="rounded" />
    Vet Arica
  </a>
</div>

<div id="sidebarBackdrop" class="sidebar-backdrop"></div>

<aside id="sidebar" class="sidebar sidebar-doctora">
  <div class="sidebar-brand">
    <img src="{% static 'inicio/img/logo.jpg' %}" alt="Vet Arica" height="36" class="rounded" />
    <div>
      <strong>VetArica</strong>
      <span>Portal Veterinaria</span>
    </div>
  </div>

  <nav class="sidebar-nav">
  <a href="{% url 'inicio_doctora' %}"
     class="sidebar-link {% if request.resolver_match.url_name == 'inicio_doctora' %}active{% endif %}">
    <i class="bi bi-grid"></i> Inicio
  </a>
  <a href="{% url 'agenda_doctora' %}"
     class="sidebar-link {% if request.resolver_match.url_name == 'agenda_doctora' %}active{% endif %}">
    <i class="bi bi-calendar-week"></i> Agenda
  </a>
  <a href="{% url 'bloqueos_doctora' %}"
     class="sidebar-link {% if request.resolver_match.url_name == 'bloqueos_doctora' %}active{% endif %}">
    <i class="bi bi-calendar-x"></i> Bloqueos
  </a>
  {% if request.user.rol == 'veterinaria' %}
  <a href="{% url 'ingresos_doctora' %}"
     class="sidebar-link {% if request.resolver_match.url_name == 'ingresos_doctora' %}active{% endif %}">
    <i class="bi bi-cash-coin"></i> Ingresos
  </a>
  <a href="{% url 'usuarios_list' %}"
     class="sidebar-link {% if request.resolver_match.url_name == 'usuarios_list' %}active{% endif %}">
    <i class="bi bi-people"></i> Usuarios
  </a>
  {% endif %}
</nav>
  <div class="sidebar-footer">
    <a href="{% url 'logout' %}" class="sidebar-link">
      <i class="bi bi-box-arrow-right"></i> Cerrar sesión
    </a>
  </div>
</aside>
