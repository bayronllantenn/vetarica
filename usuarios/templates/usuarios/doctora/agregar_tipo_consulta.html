{% load static %}
{% load crispy_forms_tags %}
<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Agregar Tipo de Consulta - Vet Arica</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/notyf@3/notyf.min.css"
      rel="stylesheet"
    />
    <link href="{% static 'citas/css/agendar.css' %}" rel="stylesheet" />
  </head>

  <body>

    <form class="form" method="post" novalidate>
      {% csrf_token %}

      <a href="{% url 'inicio_doctora' %}" class="auth-back-link">
        <i class="bi bi-arrow-left"></i> Volver al inicio
      </a>

      <p class="form-title" style="margin-top: 2rem;">Agregar tipo de consulta</p>
      <p class="form-subtitle">Completa los datos del nuevo tipo de consulta.</p>

      {{ form.nombre|as_crispy_field }}
      {{ form.precio_base|as_crispy_field }}

      <button type="submit" class="submit">Guardar</button>
    </form>

    <script src="https://cdn.jsdelivr.net/npm/notyf@3/notyf.min.js"></script>

    <script>
      const notyf = new Notyf({
        duration: 3000,
        position: { x: "center", y: "top" },
      });

      {% for message in messages %}
        notyf.{% if message.tags == 'success' %}success{% else %}error{% endif %}("{{ message|escapejs }}");
        
      {% endfor %} {% for error in form.non_field_errors %}
        notyf.error("{{ error|escapejs }}");
      {% endfor %}
    </script>

  </body>
</html>
