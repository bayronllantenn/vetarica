{% load static %}
{% load crispy_forms_tags %}
<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Agregar servicio - Vet Arica</title>
    <link rel="icon" href="{% static 'inicio/img/marca/favicon.png' %}" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/notyf@3/notyf.min.css"
      rel="stylesheet"
    />
    <link href="{% static 'citas/css/agendar.css' %}" rel="stylesheet" />
    <link href="{% static 'usuarios/css/crear_tipo_consulta.css' %}" rel="stylesheet" />
  </head>
  <body>
    <img src="{% static 'inicio/img/ilustraciones/nube_izquierda.png' %}" alt="" class="nube nube-izquierda"/>
    <img src="{% static 'inicio/img/ilustraciones/nube_derecha.png' %}" alt="" class="nube nube-derecha"/>

    <img src="{% static 'inicio/img/ilustraciones/golden.png' %}" alt="Perro" class="mascota mascota-perro"/>
    <img src="{% static 'inicio/img/ilustraciones/gato_foto.png' %}" alt="Gato" class="mascota mascota-gato"/>

    <form class="form" method="post" novalidate>
      {% csrf_token %}
      <a href="{% url 'tipos_servicios' %}" class="boton-volver">
        <i class="bi bi-chevron-left"></i> Volver
      </a>

      <img src="{% static 'inicio/img/marca/logo2.png' %}" alt="Vet Arica" class="logo"/>
      <p class="form-title">Agregar servicio</p>
      <p class="form-subtitle">
        Ingresa el nombre y el precio del nuevo servicio.
      </p>

      {{ form.nombre|as_crispy_field }}
      {{ form.precio_base|as_crispy_field }}
      {{ form.visible_en_web|as_crispy_field }}

      <button type="submit" class="submit">Agregar servicio</button>
    </form>
    <script src="https://cdn.jsdelivr.net/npm/notyf@3/notyf.min.js"></script>
    <script>
      const notyf = new Notyf({
        duration: 3000,
        position: { x: "center", y: "top" },
      });

      {% for message in messages %}
        notyf.{% if message.tags == 'success' %}success{% else %}error{% endif %}("{{ message|escapejs }}");
      {% endfor %}

      {% for error in form.non_field_errors %}
        notyf.error("{{ error|escapejs }}");
      {% endfor %}
    </script>
  </body>
</html>
