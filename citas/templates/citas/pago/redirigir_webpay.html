{% load static %}
<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Redirigiendo a Webpay - Vet Arica</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"/>
    <link href="{% static 'citas/css/redirigir_webpay.css' %}" rel="stylesheet" />
  </head>
  <body>
    <img src="{% static 'inicio/img/ilustraciones/nube_izquierda.png' %}" alt="" class="nube nube-izquierda"/>
    <img src="{% static 'inicio/img/ilustraciones/nube_derecha.png' %}" alt="" class="nube nube-derecha"/>

    <img src="{% static 'inicio/img/ilustraciones/golden.png' %}" alt="Perro" class="mascota mascota-perro"/>
    <img src="{% static 'inicio/img/ilustraciones/gato_foto.png' %}" alt="Gato" class="mascota mascota-gato"/>

    <div class="tarjeta">

      <img src="{% static 'inicio/img/logo2.png' %}" alt="Vet Arica" class="logo"/>
      <img src="{% static 'inicio/img/originales/Tarjeta_webpay.png' %}" alt="Tarjeta de pago" class="ilustracion"/>

      <h1 class="titulo">Redirigiendo a Webpay</h1>
      <p class="texto">Espera un momento, serás enviado al portal de pago de forma segura.</p>

      <div class="puntos">
        <span class="punto"></span>
        <span class="punto"></span>
        <span class="punto"></span>
      </div>

      <form id="formulario-webpay" method="POST" action="{{ url }}">
        <input type="hidden" name="token_ws" value="{{ token }}" />
        <button type="submit" class="boton">Ir a pagar <i class="bi bi-box-arrow-up-right"></i></button>
      </form>

      <p class="pago-seguro"><i class="bi bi-shield-check"></i> Pago seguro con Webpay Plus</p>
    </div>

    <script>
      setTimeout(function () {
        document.getElementById('formulario-webpay').submit();
      }, 2000);
    </script>

  </body>
</html>
